include required(classpath("application"))

backend {
  default = "LSF"

  providers {
    LSF {
      actor-factory = "cromwell.backend.impl.sfs.config.ConfigBackendLifecycleActorFactory"
      config {
        concurrent-job-limit = 200

        runtime-attributes = """
        Int cpu = 1
        Int memory_mb = 45000
        String? docker
        """

        # Non-docker submission (e.g., local R/Python if available on host)
        submit = """
        LSF_DOCKER_PRESERVE_ENVIRONMENT=false \
        bsub \
        -J ${job_name} \
        -cwd ${cwd} \
        -o /storage1/fs1/christophermaher/Active/maherlab/saha.d/projects/prostate_ploidy/R/crpc_analysis/cromwell-workflow-logs/cromwell-%J.out \
        -e /storage1/fs1/christophermaher/Active/maherlab/saha.d/projects/prostate_ploidy/R/crpc_analysis/cromwell-workflow-logs/cromwell-%J.err \
        -q 'general' \
        -g '/saha.d/max100' \
        -G 'compute-christophermaher' \
        -M ${memory_mb}M \
        -n ${cpu} \
        -R "span[hosts=1] select[mem>${memory_mb}M] rusage[mem=${memory_mb}M]" \
        /bin/bash ${script}
        """
        
        # Docker submission (Crucial for your R/Python Pipeline)
        submit-docker = """
        LSF_DOCKER_PRESERVE_ENVIRONMENT=false \
        LSF_DOCKER_VOLUMES='${cwd}:${docker_cwd} /storage1/fs1/christophermaher/Active/maherlab/saha.d:/storage1/fs1/christophermaher/Active/maherlab/saha.d' \
        bsub  \
        -J ${job_name} \
        -cwd ${cwd} \
        -o /storage1/fs1/christophermaher/Active/maherlab/saha.d/projects/prostate_ploidy/R/crpc_analysis/cromwell-workflow-logs/cromwell-%J.out \
        -e /storage1/fs1/christophermaher/Active/maherlab/saha.d/projects/prostate_ploidy/R/crpc_analysis/cromwell-workflow-logs/cromwell-%J.err \
        -q general \
        -g /saha.d/max100 \
        -G compute-christophermaher \
        -a "docker(${docker})" \
        -M ${memory_mb}M \
        -n ${cpu} \
        -R "span[hosts=1] select[mem>${memory_mb}M] rusage[mem=${memory_mb}M]" \
        /bin/bash ${script}
        """

        kill = "bkill ${job_id}"
        docker-kill = "bkill ${job_id}"
        check-alive = "bjobs -noheader -o stat ${job_id} | /bin/grep 'PEND\\|RUN'"
        job-id-regex = "Job <(\\d+)>.*"

        # Where task-specific data is stored
        root = "/storage1/fs1/christophermaher/Active/maherlab/saha.d/projects/prostate_ploidy/R/crpc_analysis/cromwell-executions"
      }
    }
  }
}

workflow-options {
  # Log directory
  workflow-log-dir = "/storage1/fs1/christophermaher/Active/maherlab/saha.d/projects/prostate_ploidy/R/crpc_analysis/cromwell-workflow-logs"
  workflow-log-temporary = true
  workflow_failure_mode: "ContinueWhilePossible"
  
  # Output directory
  final_workflow_outputs_dir : "/storage1/fs1/christophermaher/Active/maherlab/saha.d/projects/prostate_ploidy/R/crpc_analysis/cromwell-output"
}

system {
  max-retries = 5
  workflow-restart = false
}
